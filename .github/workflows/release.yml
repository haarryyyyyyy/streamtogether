name: Build & Release WatchTogether Android App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: 🚀 Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: 🔧 Make gradlew executable
        run: |
          chmod +x android/gradlew || true

      - name: 🧪 Run Unit Tests & Sync Verification
        working-directory: android
        run: |
          ./gradlew testDebugUnitTest --no-daemon

      - name: 📦 Build Android Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🏷️ Determine Release Tag & Version
        id: vars
        run: |
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' android/app/build.gradle.kts | cut -d '"' -f 2 || echo "2.0.0")
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v${VERSION_NAME}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=WatchTogether ${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: 📋 Prepare Artifacts
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/WatchTogether-${{ steps.vars.outputs.tag_name }}.apk

      - name: 🚀 Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_name }}
          draft: false
          prerelease: false
          make_latest: true
          files: release-output/*.apk
          body: |
            ## 🎬 WatchTogether — Release ${{ steps.vars.outputs.tag_name }}

            ### 🚀 Major Highlights in Version 2.0:
            - **Permanent Stable Signing Key**: Fixed signature conflicts across all future updates.
            - **Eliminated Long-Movie Playback Drift**: Host periodic heartbeat continuously anchors playback state so guests stay perfectly synchronized frame-for-frame throughout 2-3 hour movies.
            - **Coordinated Seek Pre-buffering Gate**: When seeking, all devices pause and pre-buffer before resuming playback simultaneously in lockstep.
            - **Custom Caption / Subtitle Rendering**: Embedded subtitle selection dialog with default OFF state and high-contrast captions.
            - **Watching Now Live Sync Button**: Instant one-tap synchronization for all participants to the exact current duration.
            - **Swipe Gestures & Lock Controls**: Left swipe for brightness HUD, right swipe for volume HUD, and lock controls in fullscreen.
            - **In-Player Overlay Live Chat**: Clean stacked floating chat overlay in landscape fullscreen.
            - **Zero Onboarding Friction**: No accounts, passwords, or emails. Instant 6-digit numeric room codes.
