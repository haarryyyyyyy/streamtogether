name: Build & Release WatchTogether Android App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: 🚀 Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: 🔧 Make gradlew executable
        run: |
          chmod +x android/gradlew || true

      - name: 🧪 Run Unit Tests & Sync Verification
        working-directory: android
        run: |
          ./gradlew testDebugUnitTest --no-daemon

      - name: 📦 Build Android Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🏷️ Determine Release Tag & Version
        id: vars
        run: |
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' android/app/build.gradle.kts | cut -d '"' -f 2 || echo "1.9.0")
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v${VERSION_NAME}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=WatchTogether ${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: 📋 Prepare Artifacts
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/WatchTogether-${{ steps.vars.outputs.tag_name }}.apk

      - name: 🚀 Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_name }}
          draft: false
          prerelease: false
          make_latest: true
          files: release-output/*.apk
          body: |
            ## 🎬 WatchTogether — Release ${{ steps.vars.outputs.tag_name }}

            ### ✨ What's New in this Release:
            - **Seamless Guest Playback**: Fixed player feedback loop; guest devices automatically synchronize and play without permission errors.
            - **Extensive Audio Codec Support**: Automatic software fallback for AC3, EAC3, DTS, Opus, and multi-channel audio tracks.
            - **6-Digit Numeric Room Codes**: Simple 6-digit room codes (e.g., `849201`) with direct numeric keypad input.
            - **Fullscreen Rotation Button**: Instant toggle between YouTube-style Portrait (with live chat below) and Landscape Fullscreen theater view.
            - **Zero Onboarding Friction**: No registration, no login, no passwords. Open & watch in seconds!
            - **Server-Authoritative Sync**: NTP clock calibration with dynamic micro-drift speed ramping.
            - **Live Text Chat & Host Controls**: Clean real-time messaging, host permissions, and kick management.

            ### 📲 Download & Install:
            Download the attached `WatchTogether-${{ steps.vars.outputs.tag_name }}.apk` below and install directly on your Android device!
