name: Build & Release WatchTogether Android App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: 🚀 Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔧 Make gradlew executable
        run: |
          chmod +x android/gradlew || true

      - name: 🧪 Run Unit Tests & Sync Verification
        working-directory: android
        run: |
          ./gradlew testDebugUnitTest --no-daemon

      - name: 📦 Build Android Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🏷️ Determine Release Tag & Version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v1.0.${{ github.run_number }}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=WatchTogether ${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: 📋 Prepare Artifacts
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/WatchTogether-${{ steps.vars.outputs.tag_name }}.apk

      - name: 🚀 Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_name }}
          draft: false
          prerelease: false
          files: release-output/*.apk
          body: |
            ## 🎬 WatchTogether — Release ${{ steps.vars.outputs.tag_name }}

            ### ✨ What's New:
            - **Zero Onboarding Friction**: No registration, no login, no passwords. Open & watch in seconds!
            - **Server-Authoritative Sync**: Intelligent NTP clock offset calibration and dynamic drift correction.
            - **Room Control Modes**: Host-Only mode and Shared Control mode with real-time toggle.
            - **Interactive Room Sharing**: 1-click room code copy and native Android share integration.
            - **Live Text Chat**: Real-time theater messaging with host badges and unread indicator.
            - **Recent Room History**: Instant 1-tap rejoin stored securely on device.

            ### 📲 Download & Install:
            Download the attached `WatchTogether-${{ steps.vars.outputs.tag_name }}.apk` below and install directly on your Android device!
