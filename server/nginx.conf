events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Allow unlimited upload size for video streaming
    client_max_body_size 0;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    upstream backend_upstream {
        server watchtogether-server:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name stream2gether.duckdns.org _;

        # Health Check
        location /health {
            proxy_pass http://backend_upstream/health;
            proxy_set_header Host $host;
        }

        # Video Streaming & Uploads
        location /api/v1/stream/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # WebSocket & API Proxy
        location / {
            limit_req zone=api_limit burst=100 nodelay;

            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # HTTPS / WSS SSL Server
    server {
        listen 443 ssl;
        http2 on;
        server_name stream2gether.duckdns.org;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Health Check
        location /health {
            proxy_pass http://backend_upstream/health;
            proxy_set_header Host $host;
        }

        # Video Streaming & Uploads over HTTPS
        location /api/v1/stream/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Secure WebSocket & HTTPS API Proxy
        location / {
            limit_req zone=api_limit burst=100 nodelay;

            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
